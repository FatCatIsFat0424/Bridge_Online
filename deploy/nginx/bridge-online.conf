# Include inside the existing HTTPS server block for acserver.csie.org.
location = /bridge_online {
    return 301 /bridge_online/;
}

location ^~ /bridge_online/api/ {
    # A 2 MiB background expands to about 2.67 MiB in the JSON upload.
    client_max_body_size 3m;
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_set_header Host $host;
    # Overwrite, rather than append to, client-supplied forwarding headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cookie_path / /bridge_online/;
}

location ^~ /bridge_online/socket.io/ {
    proxy_pass http://127.0.0.1:3001/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 75s;
    proxy_buffering off;
}

location = /bridge_online/health {
    proxy_pass http://127.0.0.1:3001/health;
}

location ^~ /bridge_online/ {
    root /opt/bridge-online/www;
    try_files $uri $uri/ /bridge_online/index.html;
    add_header Cache-Control "no-cache";
}
